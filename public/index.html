<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur d'Accessibilité Snapdesk</title>
    <style>
        :root {
            --snap-rose: #e590a1;
            --snap-dark: #2d3436;
            --snap-gray: #f9f9f9;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #fcfcfc;
            color: var(--snap-dark);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        h1 {
            color: var(--snap-rose);
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
        }
        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
            font-size: 14px;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--snap-rose);
            outline: none;
        }
        /* Système d'onglets */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            background: #f5f5f5;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--snap-rose);
            color: white;
            border-color: var(--snap-rose);
        }
        /* Grilles pour les bureaux */
        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
        }
        button#mainBtn {
            background: var(--snap-rose);
            color: white;
            border: none;
            padding: 18px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            transition: transform 0.1s;
        }
        button#mainBtn:active {
            transform: scale(0.98);
        }
        button#mainBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        /* Résultats */
        #results {
            margin-top: 30px;
            display: none;
            padding: 25px;
            background: #fffafa;
            border-radius: 15px;
            border: 1px solid #ffe4e8;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th {
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            color: #888;
            border-bottom: 2px solid var(--snap-rose);
            padding-bottom: 10px;
        }
        td {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
